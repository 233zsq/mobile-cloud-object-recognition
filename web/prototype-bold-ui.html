<body>
  <header class="preview-top"><b>CAMPUS / 视觉探索</b><span>本地交互视觉稿 · 全部为示例数据 · 不上传照片</span></header>
  <main id="prototype" class="stage"></main>
  <nav id="switcher" class="prototype-switcher" aria-label="切换视觉方向"></nav>
  <script>
    (() => {
      if (!['127.0.0.1', 'localhost', ''].includes(location.hostname)) { document.getElementById('prototype').textContent = '此原型仅供本地预览。'; return; }
      const root = document.getElementById('prototype'), switcher = document.getElementById('switcher');
      const directions = {
        A: {name:'观察手册', title:'A / 把识别，变成一次发现。', description:'推荐方向。奶油白、深森林绿和亮黄绿；手册式排版、大取景框、识别票据。温暖、有记忆点，适合校园项目。'},
        B: {name:'扫描实验室', title:'B / 随身的一台扫描仪。', description:'相机优先的深色取景器，黄绿定位标记；网页像一台精密仪器，信息密度更高。'},
        C: {name:'物品索引', title:'C / 为日常物品，建立索引。', description:'大字号、硬边框和不对称色块；安卓像一张交互海报，网页强调编号、数量和列表。'}
      };
      const initial = new URL(location.href).searchParams.get('variant');
      const state = {variant: directions[initial] ? initial : 'A', mode:'device', tab:'capture', result:false, model:'', phoneModel:''};
      const labels = ['水杯','伞','书本','笔袋','鼠标','键盘','耳机','充电器','钥匙','背包'];
      const data = Array.from({length:48}, (_,i) => ({id:i+1, label:labels[i%10], model:i<32?'campus-evolve-v2':'campus-gpu-v1', source:i%3===0?'cloud':'device', confidence:70+i%6*4.5, latency:18+i%9*5, corrected:i%13===0}));
      const icon = name => {
        const paths = {camera:'<path d="M3 7h4l2-3h6l2 3h4v13H3Z"/><circle cx="12" cy="13" r="4"/>', cloud:'<path d="M7 18a5 5 0 0 1-1-10 6 6 0 0 1 11-2 6 6 0 0 1 1 12Z"/>', chip:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h1m-1 6h1m-1 6h1"/>', settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>', arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>', back:'<path d="M19 12H5m6-6-6 6 6 6"/>'};
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[name]+'</svg>';
      };
      const mode = () => '<div class="mode" aria-label="识别位置">'+['device','cloud'].map(m=>'<button data-mode="'+m+'" class="'+(state.mode===m?'active':'')+'">'+icon(m==='device'?'chip':'cloud')+(m==='device'?'本地识别':'云端识别')+'</button>').join('')+'</div>';
      const camera = () => '<div class="camera"><span class="camera-label">'+(state.variant==='B'?'TARGET / 01':'日常物品 · 示例')+'</span><div class="camera-mark"></div><div class="cup" role="img" aria-label="水杯插画"></div><span class="camera-caption">把一个主要物品放入画面</span></div>';
      const captureActions = () => '<div class="capture-actions"><button data-action="import">从相册导入</button><button class="shoot" data-action="shoot" aria-label="模拟拍照识别"></button><button data-action="hint">十种物品</button></div>';
      const receipt = () => '<div class="result"><div class="result-top"><div><small>'+(state.result?'识别完成':'示例识别结果')+' / '+(state.mode==='device'?'LOCAL':'CLOUD')+'</small><h3>水杯</h3></div><strong>94.6<span style="font-size:11px">%</span></strong></div><p>campus-evolve-v2 · '+(state.mode==='device'?'本地用时 18 ms':'云端计算 47 ms · 总等待 420 ms')+'（示例）</p><button data-action="correct">结果不对？修正类别</button></div>';
      function capture() {
        const headings = {A:'观察手册',B:'SCAN / 01',C:'识物。'};
        const marks = {A:'FIELD<br>NOTES',B:'● SYSTEM READY',C:'CAMPUS / OBJECT INDEX'};
        return '<div class="phone-header"><h2>'+headings[state.variant]+'</h2><span>'+marks[state.variant]+'</span></div>'+mode()+camera()+captureActions()+receipt();
      }
      const modelOptions = selected => '<option value="">全部模型</option>'+['campus-evolve-v2','campus-gpu-v1'].map(m=>'<option '+(selected===m?'selected ':'')+'value="'+m+'">'+m+'</option>').join('');
      function phoneRecords() {
        const records = data.filter(r=>!state.phoneModel||r.model===state.phoneModel);
        return '<div class="phone-records"><h2>观察记录</h2><p class="hint">本机示例 '+records.length+' 条 · 模型版本可筛选</p><select aria-label="本机模型筛选" id="phone-model">'+modelOptions(state.phoneModel)+'</select>'+records.slice(0,5).map(r=>'<div class="record-row"><span class="index">'+String(r.id).padStart(2,'0')+'</span><div><strong>'+r.label+'</strong><small>'+r.model+'<br>'+(r.source==='device'?'本地':'云端')+' · 已同步</small></div><em>'+r.confidence.toFixed(1)+'%</em></div>').join('')+'</div>';
      }
      function phoneSettings() { return '<div class="phone-records"><h2>我的设备</h2><p class="hint">设置页布局示意</p><div class="config-row">当前模型<small>campus-evolve-v2</small></div><div class="config-row">默认识别位置<small>本地</small></div><div class="config-row">云端服务<small>设置地址与口令</small></div><div class="config-row">照片与隐私<small>选择云端时上传照片</small></div><div class="config-row">版本说明<small>关于这次观察</small></div></div>'; }
      function phone() { return '<section class="phone"><div class="phone-status"><span>9:41</span><span>●●● ▰</span></div><div class="phone-body">'+(state.tab==='capture'?capture():state.tab==='records'?phoneRecords():phoneSettings())+'</div><nav class="phone-nav">'+[['capture','camera','识别'],['records','list','记录'],['settings','settings','我的']].map(([tab,ico,label])=>'<button data-tab="'+tab+'" class="'+(state.tab===tab?'active':'')+'">'+icon(ico)+label+'</button>').join('')+'</nav></section>'; }
      const selectedData = () => data.filter(r=>!state.model||r.model===state.model);
      function metrics(rows, omitTotal=false) { return '<div class="metrics">'+(omitTotal?'':'<div class="stat"><span>采集记录 / OBSERVATIONS</span><b>'+String(rows.length).padStart(2,'0')+'</b><small>已入库 · 当前筛选</small></div>')+'<div class="stat"><span>本地 / ON DEVICE</span><b>'+String(rows.filter(r=>r.source==='device').length).padStart(2,'0')+'</b><small>在手机上完成识别</small></div><div class="stat"><span>已修正 / CORRECTED</span><b>'+String(rows.filter(r=>r.corrected).length).padStart(2,'0')+'</b><small>保留原始预测</small></div></div>'; }
      function distribution(rows) { const counts=labels.map(label=>rows.filter(r=>r.label===label).length), max=Math.max(...counts,1); return '<div class="distribution">'+labels.map((label,i)=>'<div class="bar"><em>'+counts[i]+'</em><i style="height:'+Math.max(3,counts[i]/max*78)+'px"></i><small>'+label+'</small></div>').join('')+'</div>'; }
      function recordsTable(rows) { return '<table class="table"><thead><tr><th>物品 / 时间</th><th>识别来源</th><th>置信度</th><th>模型版本</th></tr></thead><tbody>'+rows.slice(0,4).map(r=>'<tr><td>'+r.label+'<small>10-12 10:'+String(58-r.id).padStart(2,'0')+'</small></td><td><span class="source-tag">'+(r.source==='device'?'本地':'云端')+'</span></td><td>'+r.confidence.toFixed(1)+'%</td><td><small>'+r.model+'</small></td></tr>').join('')+'</tbody></table>'; }
      const filter = () => '<select id="web-model" aria-label="云端记录模型筛选">'+modelOptions(state.model)+'</select>';
      const sectionTitle = (text, hint) => '<div class="section-head"><b>'+text+'</b><small>'+hint+'</small></div>';
      function VariantA(rows) { return '<div class="workspace"><aside class="sidebar"><div class="sidebar-logo">FIELD<br>NOTES<small>CAMPUS</small></div><nav><button class="active">01 / 数据概览</button><button data-action="web-records">02 / 观察记录</button><button data-action="web-review">03 / 照片审核</button></nav><div class="sidebar-bottom">EVERYDAY OBJECTS<br>MODEL / EVOLVE V2</div></aside><div class="web-main"><div class="web-top"><span>工作空间 / 数据概览</span><div><span class="live">服务正常</span>'+filter()+'</div></div><div class="web-hero"><div><h2>每件物品，<br>都值得被看见。</h2><p>把一次次识别，收集成对日常的观察。</p></div><div class="hero-stamp">CAMPUS<br>FIELD NOTES<br>2026 / 10</div></div>'+metrics(rows)+sectionTitle('物品分布','01 / DISTRIBUTION')+distribution(rows)+sectionTitle('最近观察','02 / LATEST OBSERVATIONS')+recordsTable(rows)+'</div></div>'; }
      function VariantB(rows) { return '<div class="workspace"><div class="web-main"><div class="console-head"><div><b>SCAN</b> / CONTROL</div><span class="live">ALL SYSTEMS READY</span></div><div class="console-nav"><span>01 / OVERVIEW</span><span>02 / RECORDS</span><span>03 / REVIEW</span></div><div class="web-top"><span>实时采集控制台 / campus-evolve-v2</span>'+filter()+'</div>'+metrics(rows)+'<div class="console-grid"><div>'+sectionTitle('OBJECT DISTRIBUTION','当前筛选')+distribution(rows)+'</div><div class="diagnostic"><b>RUNTIME / STATUS</b><br>EDGE / READY<br>CLOUD / READY<br>MODEL / SAME VERSION<br>SYNC / UP TO DATE</div></div>'+sectionTitle('最近采集 / EVENT LOG','DEMONSTRATION DATA')+recordsTable(rows)+'</div></div>'; }
      function VariantC(rows) { return '<div class="workspace"><div class="web-main"><div class="index-head"><strong>INDEX.</strong><nav><b>概览</b><span>记录</span><span>审核</span></nav>'+filter()+'</div><div class="index-hero"><h2>日常物品<br>数据索引</h2><div class="index-total"><span>OBSERVATIONS / 当前筛选</span><b>'+String(rows.length).padStart(4,'0')+'</b></div></div>'+metrics(rows,true)+'<div class="index-content"><div>'+sectionTitle('01 / 类别分布','全部物品')+distribution(rows)+'</div><div>'+sectionTitle('02 / 最近记录','最新四条')+recordsTable(rows)+'</div></div></div></div>'; }
      function render() {
        const direction=directions[state.variant]; root.dataset.variant=state.variant;
        root.innerHTML='<div class="direction"><h1>'+direction.title+'</h1><p>'+direction.description+'</p></div><div class="samples"><div class="phone-sample"><div class="sample-label"><span>ANDROID / 竖屏</span><span>可点击切换与拍照</span></div>'+phone()+'</div><div><div class="sample-label"><span>WEB / 云端工作空间</span><span>可按模型筛选示例记录</span></div>'+({A:VariantA,B:VariantB,C:VariantC}[state.variant])(selectedData())+'</div></div><div class="state-line">VARIANT / '+state.variant+' · MODE / '+state.mode.toUpperCase()+' · PHONE / '+state.tab.toUpperCase()+' · FILTER / '+(state.model||'ALL')+' · 示例数据</div><div class="toast" role="status" id="toast"></div>';
        switcher.innerHTML='<button data-cycle="-1" aria-label="上一个设计">'+icon('back')+'</button>'+Object.entries(directions).map(([key,d])=>'<button class="variant-button '+(state.variant===key?'active':'')+'" data-variant="'+key+'">'+key+' · '+d.name+'</button>').join('')+'<button data-cycle="1" aria-label="下一个设计">'+icon('arrow')+'</button>';
      }
      function choose(variant) { state.variant=variant; const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render(); }
      function cycle(step) { const keys=Object.keys(directions);choose(keys[(keys.indexOf(state.variant)+step+keys.length)%keys.length]); }
      switcher.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.variant)choose(b.dataset.variant);else cycle(Number(b.dataset.cycle));});
      root.addEventListener('change',e=>{if(e.target.id==='web-model')state.model=e.target.value;if(e.target.id==='phone-model')state.phoneModel=e.target.value;render();});
      root.addEventListener('click',e=>{
        const b=e.target.closest('button');if(!b)return;
        if(b.dataset.mode){state.mode=b.dataset.mode;render();return;}
        if(b.dataset.tab){state.tab=b.dataset.tab;render();return;}
        const action=b.dataset.action;
        if(action==='shoot'||action==='import'){state.result=true;render();}
        const messages={shoot:'拍照识别交互预览：这里没有打开相机或上传照片。',import:'相册入口预览：真实 App 将使用系统图片选择器。',correct:'修正入口预览：真实 App 会保留原预测，再追加正确类别。',hint:'水杯、伞、书本、笔袋、鼠标、键盘、耳机、充电器、钥匙、背包。','web-records':'记录入口示意：真实网页支持时间、模型、类别与来源筛选。','web-review':'审核入口示意：沿用组员登录、疑难项及抽检队列。'};
        if(messages[action]){const toast=document.getElementById('toast');toast.textContent=messages[action];toast.classList.add('visible');}
      });
      document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1);}});
      render();
    })();
  </script>
</body>
</html>
