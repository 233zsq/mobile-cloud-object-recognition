{% extends 'base.html' %}{% block body %}<section class="panel auth"><p class="eyebrow">JOIN THE WORKSPACE</p><h1>创建{{'管理员' if role=='admin' else '成员'}}账号</h1><p class="muted">邀请码一次有效，请妥善保管自己的密码。</p><form method="post"><input name="csrf" type="hidden" value="{{csrf}}"><label>账号（字母、数字、下划线）<input name="username" required pattern="[A-Za-z0-9_-]{1,80}" autocomplete="username"></label><label>密码（至少12位）<input name="password" type="password" required minlength="12" maxlength="160" autocomplete="new-password"></label><button class="button primary">创建账号</button></form></section>{% endblock %}
