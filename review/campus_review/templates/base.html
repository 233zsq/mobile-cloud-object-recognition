<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}照片审核{% endblock %} · Campus Review</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><aside><a class="brand" href="{{url_for('index')}}"><span class="logo">C</span> Campus Review</a><p class="eyebrow">模型成长工作台</p><nav><a href="{{url_for('index')}}">▦　照片审核</a><a href="{{url_for('upload')}}">＋　上传照片</a><a href="{{url_for('index')}}#models">◈　模型对比</a><a href="{{url_for('index')}}#batches">▤　训练批次</a></nav><div class="aside-bottom"><span class="live-dot"></span> 人工审核 · 人工发布<br><small>campus-evolve 系列</small></div></aside>
<div class="main"><header><span class="muted">校园物品识别 / {% block location %}数据工作台{% endblock %}</span>{% if g.user %}<div class="account">{{g.user.username}} <span class="badge">{{'管理员' if g.user.role=='admin' else '审核成员'}}</span><form action="{{url_for('logout')}}" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><button class="link">退出</button></form></div>{% endif %}</header><main>{% block body %}{% endblock %}</main><footer>原始网图与基准模型已保留 · 独立测试照片请交组长保管，不上传到训练审核台</footer></div></body></html>
