{% extends 'base.html' %}{% block title %}上传照片{% endblock %}{% block body %}<p class="eyebrow">ADD TRAINING PHOTOS</p><h1>上传新照片</h1><p class="muted">每张保留一个主要主体。拍摄更多不同实物，能帮助模型适应真实场景。</p><section class="panel form-panel"><form method="post" enctype="multipart/form-data"><input name="csrf" type="hidden" value="{{csrf}}"><label class="upload-zone">选择物品照片<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required><small>JPEG / PNG / WebP · 单张最大8MiB · 短边至少128像素</small></label><div class="two-col"><label>真实类别<select name="category">{% for c in categories %}<option value="{{c.id}}">{{c.display_name}}</option>{% endfor %}</select></label><label>实物ID<input name="object_id" placeholder="如：cup-blue-01" required maxlength="160"><small>同一件实物始终使用同一个ID，请与组员协调。</small></label><label>采集场次<input name="session_id" placeholder="如：lab-20261009-am" required maxlength="160"></label><label>拍摄系列 / 重复组（可选）<input name="group_id" placeholder="同组照片填写相同ID" maxlength="160"></label></div><p class="note">仅接收用于训练和验证的照片。独立验收测试图由组长另行冻结，请勿上传。键盘包含独立外接和笔记本内置键盘，须以清楚可辨的键盘为主体。</p><button class="button primary">上传并进入审核</button></form></section>{% endblock %}
