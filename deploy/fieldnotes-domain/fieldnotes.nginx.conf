# FieldNotes main site, API, iPhone client and protected review mount.
limit_req_zone $binary_remote_addr zone=fieldnotes_api:1m rate=10r/s;
server {
  listen 80;
  listen [::]:80;
  server_name fieldnotes.bigdogaaa.cn;
  return 308 https://fieldnotes.bigdogaaa.cn$request_uri;
}
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name fieldnotes.bigdogaaa.cn;
  ssl_certificate /etc/fieldnotes-tls/fullchain.pem;
  ssl_certificate_key /etc/fieldnotes-tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:fieldnotes_tls:1m;
  ssl_session_tickets off;
  server_tokens off;
  access_log off;
  client_max_body_size 10m;
  limit_req_status 429;
  location = /review { return 308 /review/; }
  location ^~ /review/ {
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:8081/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix /review;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_redirect off;
  }
  location = /api/health {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
  }
  location /api/ {
    if ($mobile_cloud_authorized = 0) { return 401; }
    limit_req zone=fieldnotes_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
  }
  location = / { proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
  }
  location /assets/ { proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
  }
  location = /ios { return 308 /ios/; }
  location /ios/ {
    alias /var/www/mobile-cloud-ios/;
    index index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer";
  }
  location = /ios/manifest.webmanifest {
    alias /var/www/mobile-cloud-ios/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
  location / { return 404; }
}
