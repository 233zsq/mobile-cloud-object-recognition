limit_req_zone $binary_remote_addr zone=mobile_cloud_api:1m rate=10r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 49.232.195.47;
    return 308 https://49.232.195.47$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 49.232.195.47;
    server_tokens off;
    ssl_certificate /etc/mobile-cloud-backend/tls/server.crt;
    ssl_certificate_key /etc/mobile-cloud-backend/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mobile_cloud_tls:1m;
    client_max_body_size 10m;
    limit_req_status 429;

    location = /api/health {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }

    location /api/ {
        if ($mobile_cloud_authorized = 0) { return 401; }
        limit_req zone=mobile_cloud_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }

    location / { return 404; }
}
